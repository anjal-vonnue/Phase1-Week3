<!doctype html>
<html>
  <head>
    <title>Navigation bar</title>
    <meta charset="utf-8" />
    <meta name="description" content="sticky Navigation bar" />
    <link rel="stylesheet" href="navigation.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <nav id="nav">
      <div id="logo">
        <img
          src="https://prod-assets.nike.in/NIKE/nes-nike-reloaded-svc/static/assets/images/nike-logo-192x192.svg"
          alt="nike logo"
          width="60px"
        />
      </div>
      <div class="links" id="link">
        <a href="https://www.nike.com/new">New & Featured</a>
        <a href="https://www.nike.com/men">Men</a>
        <a href="https://www.nike.com/women">Women</a>
        <a href="https://www.nike.com/kids">Kids</a>
        <a href="https://www.nike.com/jordan">Jordan</a>
        <a href="https://www.nike.com/sale">Sale</a>
      </div>
      <div class="buttons" id="button">
        <button type="submit">Login</button>
        <button type="submit">Signup</button>
        <button class="hamburger" id="hamburger" onclick="openDrawer()">
          <svg
            aria-hidden="true"
            focusable="false"
            viewBox="0 0 24 24"
            role="img"
            width="24px"
            height="24px"
            fill="none"
          >
            <path
              stroke="#111111"
              stroke-width="1.5"
              d="M21 5.25H3M21 12H3m18 6.75H3"
            ></path>
          </svg>
        </button>
        <button class="close-ham" onclick="closeDrawer()">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            x="0px"
            y="0px"
            width="100"
            height="100"
            viewBox="0 0 50 50"
          >
            <path
              d="M 7.71875 6.28125 L 6.28125 7.71875 L 23.5625 25 L 6.28125 42.28125 L 7.71875 43.71875 L 25 26.4375 L 42.28125 43.71875 L 43.71875 42.28125 L 26.4375 25 L 43.71875 7.71875 L 42.28125 6.28125 L 25 23.5625 Z"
            ></path>
          </svg>
        </button>
      </div>
    </nav>
  </body>
</html>
